name: macOS desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    # Intel runner = 4 CPU / 14 GB RAM. The arm64 (M-series) runners only get 7 GB.
    runs-on: macos-26-intel
    timeout-minutes: 355 # GitHub hard-caps a single job at 6 h
    env:
      # Repo secret. Keep it 8 characters or fewer: macOS legacy VNC auth (type 2)
      # only reads the first 8. Same password unlocks the macOS login screen.
      VNC_PW: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: Check the password secret
        run: |
          if [ -z "$VNC_PW" ]; then
            echo 'ERROR: repo secret VNC_PASSWORD is not set (Settings -> Secrets and variables -> Actions).'
            exit 1
          fi
          if [ "${#VNC_PW}" -gt 8 ]; then
            echo 'ERROR: VNC_PASSWORD must be 8 characters or fewer.'
            exit 1
          fi
          echo 'VNC_PASSWORD is set.'

      - name: Create a local admin account
        # The pre-existing "runner" user has a SecureToken, so its password cannot
        # be reset from root. Make our own account instead.
        run: |
          sudo dscl . -create /Users/macuser
          sudo dscl . -create /Users/macuser UserShell /bin/zsh
          sudo dscl . -create /Users/macuser RealName "Mac User"
          sudo dscl . -create /Users/macuser UniqueID 1001
          sudo dscl . -create /Users/macuser PrimaryGroupID 80
          sudo dscl . -create /Users/macuser NFSHomeDirectory /Users/macuser
          sudo dscl . -passwd /Users/macuser "$VNC_PW"
          sudo createhomedir -c -u macuser > /dev/null
          sudo mdutil -i off -a # stop Spotlight from hammering a slow VM

      - name: Enable the built-in VNC server
        # "legacy" password auth is required: noVNC speaks plain VNC auth (type 2),
        # not the Apple Remote Desktop auth (type 30) that macOS prefers.
        run: |
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo $K -activate
          sudo $K -configure -allowAccessFor -allUsers -privs -all
          sudo $K -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PW"
          # Some macOS builds ignore -setvncpw, so also write the obfuscated pref file.
          printf '%s' "$VNC_PW" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          sudo $K -restart -agent -console

          # Prove the VNC server is really up before we bother tunnelling to it.
          python3 -c "
          import socket
          s = socket.create_connection(('127.0.0.1', 5900), 10)
          print('VNC server banner:', s.recv(12))
          "

      - name: Serve the desktop in a browser, then hold the session open
        run: |
          # noVNC turns the VNC stream into a web page, so a browser is enough --
          # no VNC client to install and no TCP tunnel that needs a paid account.
          python3 -m venv /tmp/wsv
          /tmp/wsv/bin/pip install --quiet websockify
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC
          nohup /tmp/wsv/bin/websockify --web /tmp/noVNC 6080 localhost:5900 > /tmp/websockify.log 2>&1 &

          # Cloudflare Tunnel quick tunnel: free, no account, no card, no token.
          brew install cloudflared
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          URL=""
          for _ in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 5
          done
          if [ -z "$URL" ]; then cat /tmp/cloudflared.log; exit 1; fi

          # Host and user are safe to print -- they are session-specific. The password
          # is NOT printed, so keep the repo secret somewhere you can paste it from.
          echo ""
          echo "=================================================================="
          echo "  YOUR TEMPORARY macOS DESKTOP IS READY"
          echo ""
          echo "  VNC HOST : $URL"
          echo "  VNC USER : macuser"
          echo "  VNC PASS : (the VNC_PASSWORD repo secret -- not printed here)"
          echo ""
          echo "  OPEN THIS: $URL/vnc.html?autoconnect=1&resize=scale"
          echo ""
          echo "  At the macOS login screen use  macuser  +  your password."
          echo "=================================================================="
          echo ""
          echo "Session stays up ~5.5 h, or until you press 'Cancel workflow'."

          # Hold the runner open. Add automatic stop is not possible here, so the job
          # just sleeps; cloudflared/websockify keep running as background children.
          sleep 20000
