name: macOS desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    # Intel runner = 4 CPU / 14 GB RAM. The arm64 (M-series) runners only get 7 GB.
    runs-on: macos-26-intel
    timeout-minutes: 355 # GitHub hard-caps a single job at 6 h
    env:
      # Repo secret. Keep it 8 characters or fewer: macOS legacy VNC auth (type 2)
      # only reads the first 8. Same password unlocks the macOS login screen.
      VNC_PW: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: Check the password secret
        run: |
          if [ -z "$VNC_PW" ]; then
            echo 'ERROR: repo secret VNC_PASSWORD is not set (Settings -> Secrets and variables -> Actions).'
            exit 1
          fi
          if [ "${#VNC_PW}" -gt 8 ]; then
            echo 'ERROR: VNC_PASSWORD must be 8 characters or fewer.'
            exit 1
          fi
          echo 'VNC_PASSWORD is set.'

      - name: Create a local admin account
        # The pre-existing "runner" user has a SecureToken, so its password cannot
        # be reset from root. Make our own account instead.
        run: |
          sudo dscl . -create /Users/macuser
          sudo dscl . -create /Users/macuser UserShell /bin/zsh
          sudo dscl . -create /Users/macuser RealName "Mac User"
          sudo dscl . -create /Users/macuser UniqueID 1001
          sudo dscl . -create /Users/macuser PrimaryGroupID 80
          sudo dscl . -create /Users/macuser NFSHomeDirectory /Users/macuser
          sudo dscl . -passwd /Users/macuser "$VNC_PW"
          sudo createhomedir -c -u macuser > /dev/null
          sudo mdutil -i off -a # stop Spotlight from hammering a slow VM

      - name: Enable the built-in VNC server
        # "legacy" password auth is required: noVNC speaks plain VNC auth (type 2),
        # not the Apple Remote Desktop auth (type 30) that macOS prefers.
        run: |
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo $K -activate
          sudo $K -configure -allowAccessFor -allUsers -privs -all
          sudo $K -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PW"
          # Some macOS builds ignore -setvncpw, so also write the obfuscated pref file.
          printf '%s' "$VNC_PW" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt

          # The VM has no real monitor. Without a forced mode the shared screen has no
          # framebuffer and every VNC client shows plain black. Best effort, ignored if
          # this runner image ships no VMware tools.
          sudo "/Library/Application Support/VMware Tools/vmware-resolutionSet" 1920 1080 || true

          sudo $K -restart -agent -console

          # Prove the VNC server is really up before we bother tunnelling to it.
          python3 -c "
          import socket
          s = socket.create_connection(('127.0.0.1', 5900), 10)
          print('VNC server banner:', s.recv(12))
          "

      - name: Install noVNC and cloudflared
        run: |
          python3 -m venv /tmp/wsv
          /tmp/wsv/bin/pip install --quiet websockify
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC
          brew install cloudflared

      - name: Start the desktop and the tunnel in the system domain
        # launchctl submit registers the jobs with the SYSTEM launchd, not the
        # "runner" user's session. That matters: logging in as macuser switches the
        # console session, and anything started with plain nohup dies with it, which
        # is what produced "Cloudflare Tunnel error 1033" and the black screen.
        run: |
          CF="$(command -v cloudflared)"
          sudo launchctl remove com.macoscloud.websockify 2>/dev/null || true
          sudo launchctl remove com.macoscloud.tunnel 2>/dev/null || true

          sudo launchctl submit -l com.macoscloud.websockify \
            -o /tmp/websockify.log -e /tmp/websockify.err \
            -- /tmp/wsv/bin/websockify --web /tmp/noVNC 6080 localhost:5900

          sudo launchctl submit -l com.macoscloud.tunnel \
            -o /tmp/tunnel.log -e /tmp/tunnel.err \
            -- "$CF" tunnel --url http://localhost:6080 --no-autoupdate

          URL=""
          for _ in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | head -1 || true)
            [ -n "$URL" ] && break
            sleep 5
          done
          if [ -z "$URL" ]; then cat /tmp/tunnel.log /tmp/tunnel.err; exit 1; fi

          # The tunnel can answer before websockify has finished binding 6080.
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL/vnc.html" || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "noVNC HTTP status: ${code:-none}"

          # Host and user are safe to print -- they are session-specific. The password
          # is NOT printed, so keep the repo secret somewhere you can paste it from.
          echo ""
          echo "=================================================================="
          echo "  YOUR TEMPORARY macOS DESKTOP IS READY"
          echo ""
          echo "  VNC HOST : $URL"
          echo "  VNC USER : macuser"
          echo "  VNC PASS : (the VNC_PASSWORD repo secret -- not printed here)"
          echo ""
          echo "  OPEN THIS: $URL/vnc.html?autoconnect=1&resize=scale"
          echo ""
          echo "  At the macOS login screen use  macuser  +  your password."
          echo "  If the desktop comes up BLACK: reload the page. Logging in switches"
          echo "  the console session, and the first frame after the switch is often empty."
          echo "=================================================================="
          echo ""

          # Also leave the link in a file so it can be published as an artifact.
          { echo "URL  : $URL/vnc.html?autoconnect=1&resize=scale"
            echo "USER : macuser"
            echo "PASS : the VNC_PASSWORD repo secret"; } > /tmp/vnc-info.txt

      - name: Publish the connection link as an artifact
        # So the URL can be fetched without scraping the log. Never fatal.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vnc-connection
          path: /tmp/vnc-info.txt
          retention-days: 1

      - name: Keep the desktop alive and re-print the URL
        run: |
          echo 'Desktop stays online until you cancel the workflow, or until the job hits its 355-minute cap.'
          while true; do
            sleep 1800
            echo "--- $(date -u '+%H:%M UTC') still alive. URL: $(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | head -1) ---"
          done
